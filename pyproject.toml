[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-server-demo"
version = "0.1.0"
description = "LangGraph demo for Redis Agent Memory."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "google-adk>=1.15.0",
    "google-cloud-logging>=3.12.0",
    "google-cloud-aiplatform>=1.130.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
